name: build

# Builds and tests run on a self-hosted runner, not on a laptop.
#
# A release build of this package is a full optimisation pass over four hundred modules. Doing
# that repeatedly on the MacBook — while the dashboard server and a polling browser are also up
# — is enough to take the machine down, which is exactly what happened.
#
# Pushes are built on main only: a PR already gets a pull_request run for every commit, and a
# push run on top of it doubled the load on the one runner this repo has (opi-hatchery).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One live run per ref. Superseded PR runs are cancelled — a force-push shouldn't leave the
# runner finishing a build nobody can merge — but main runs are never cancelled, so every
# main commit keeps its release artifact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pinned to the Linux runner rather than the [self-hosted, arm64] pair roost uses, so this
    # lands on opi and leaves the mini to Phoenix. Linux and ARM64 are applied automatically by
    # the runner, so no new labels are needed.
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        # Reports rather than assumes. If swift is absent this says so in one line instead of
        # failing several minutes later inside a build step. The version is pinned by
        # .swift-version at the repo root — swiftly's shim on the runner selects it, and errors
        # if that toolchain isn't installed, so bumping the pin means `swiftly install <ver>`
        # on the opi first.
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null 2>&1; then
            echo "::error::no swift toolchain on this runner — install with swiftly from swift.org/install/linux"
            exit 1
          fi
          swift --version

      - name: page script parses
        # A JS syntax error in the dashboard's inline script is a page that never renders,
        # and one shipped (#58). Cheap to check, expensive to ship.
        run: bash Scripts/check-page-syntax.sh

      # The scratch path lives outside the workspace because checkout cleans untracked files on
      # every run; keeping build state across runs is what makes a warm build take seconds.
      - name: build
        run: swift build --build-tests --scratch-path "$HOME/.hatchery-ci-scratch"

      - name: test
        run: swift test --skip-build --scratch-path "$HOME/.hatchery-ci-scratch"

  release:
    # The optimisation pass the debug job never exercises, and the artifact that is the point
    # of this package: a Linux arm64 `hatchery` binary, ready for the opi or a Pi. Main and
    # manual runs only — PRs stay on the fast debug+test cycle.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64]
    # The repo default is read-only; recreating the rolling release needs contents write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: build release
        run: swift build -c release --scratch-path "$HOME/.hatchery-ci-scratch"

      - name: publish
        # A Release asset, not an Actions artifact: this account's Actions storage refuses
        # uploads ("quota has been hit" while storing zero bytes — see the support ticket
        # draft), and Release assets don't touch Actions storage. One rolling prerelease,
        # deleted and recreated per main push, so its tag always points at the commit that
        # built the asset. Plain curl against the REST API because the runner host has no gh.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tool in curl python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::no $tool on this runner"
              exit 1
            fi
          done
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          # Prior rolling releases are found through the list, not the by-tag lookup: GitHub
          # has left this release in draft state before, and the by-tag route hides drafts —
          # so the lookup missed it, the delete was skipped, and every run after that
          # compounded the mess. The list shows everything.
          for old in $(curl -sf -H "$auth" "$api/releases?per_page=100" \
            | python3 -c 'import sys,json; [print(r["id"]) for r in json.load(sys.stdin) if r.get("tag_name")=="rolling"]'); do
            curl -sf -X DELETE -H "$auth" "$api/releases/$old"
          done
          curl -sf -X DELETE -H "$auth" "$api/git/refs/tags/rolling" || true
          rid=$(curl -sf -X POST -H "$auth" "$api/releases" \
            -d "{\"tag_name\":\"rolling\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"rolling — latest main build\",\"prerelease\":true,\"draft\":false}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          cp "$HOME/.hatchery-ci-scratch/release/hatchery" hatchery-linux-arm64
          curl -sf -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
            --data-binary @hatchery-linux-arm64 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=hatchery-linux-arm64" >/dev/null
          # The step is done when the tag answers with a non-draft release carrying the
          # asset — verified from the outside, the same way a download would find it. The
          # first version trusted the POST and printed success over a draft nobody could
          # reach by tag.
          curl -sf -H "$auth" "$api/releases/tags/rolling" | python3 -c '
          import sys, json
          release = json.load(sys.stdin)
          assert not release["draft"], "rolling release is a draft"
          names = [a["name"] for a in release["assets"]]
          assert "hatchery-linux-arm64" in names, f"asset missing, found {names}"
          ' || { echo "::error::rolling release did not verify — draft, missing, or no asset"; exit 1; }
          echo "published and verified hatchery-linux-arm64 as the rolling release for ${GITHUB_SHA}"
